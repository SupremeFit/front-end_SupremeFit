<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/globalReset.css" />
    <link rel="stylesheet" href="./src/styles/globalStyle.css" />
    <link rel="stylesheet" href="./src/styles/modal.css" />
    <link rel="stylesheet" href="./src/styles/index.css" />
    <script defer type="module" src="./src/scripts/index.js"></script>
    <title>SupremeFit</title>
  </head>
  <body>
    <header class="container-header">
      <div class="container-nav">
        <h2 class="logo-enterprise">SupremeFit <span class="span-logo">Os melhores suplementos para você</span></h2>
        <nav class="menu-nav">
          <div class="shopping_cart">Carrinho <span class="cart-counter">0</span></div>
        </nav>
      </div>
    </header>
    <main class="container">
      <section class="container-promo">
        <img
          class="banner"
          src="./src/assets/banner.svg"
          alt="img_banner_site"
        />
        <h1 class="banner-title">
          Suplementos para Potencializar seu Desempenho
        </h1>
        <h3 class="banner-subtitle">VEJA NOSSOS PRODUTOS ABAIXO</h3>
        <a href="./src/pages/shop_page.html" class="shop-now-btn">Comprar</a>
      </section>
      <h3 class="title-list-products">NOSSOS PRODUTOS</h3>
      <section class="container-list-products">
        <ul class="list-products">
          
        </ul>
        <a class="btn-products-direct" href="./src/pages/shop_page.html" target="_blank">Ver Tudo</a>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-container">
        <nav class="footer-nav">
          <ul>
            <li><a href="/src/pages/shop_page.html" target="_blank">Loja</a></li>
            <li><a href="/src/pages/sobre_nos.html">Sobre nós</a></li>
          </ul>
        </nav>

        <div class="newsletter">
          <h3>Participe da nossa Newsletter para receber atualizações!</h3>
          <input type="email" placeholder="Insira seu e-mail aqui" />
          <button type="submit">Participar</button>
        </div>

        <div class="social-media">
          <a href="#"  title="WhatsApp"
            ><img src="/src/assets/whatsapp.png" alt="WhatsApp"
          /></a>

          <a href="#"  title="Instagram"
            ><img src="/src/assets/instagram.png" alt="Instagram"
          /></a>

          <a href="#"  title="Facebook"
            ><img src="/src/assets/facebook.png" alt="Facebook"
          /></a>

          <a href="#"  title="YouTube"
            ><img src="/src/assets/youtube.png" alt="YouTube"
          /></a>

          <a href="#"  title="Twitter"
            ><img src="/src/assets/twitter.png" alt="Twitter"
          /></a>
        </div>
      </div>
    </footer>
    <div class="container-product-modal" class="modal">

    </div>
    <div class="cart-modal">
      <div class="cart">
        <div class="cart-items">Nenhum item</div>
        <div class="cart-total">0</div>
      </div>
    </div>
  </body>
</html>
